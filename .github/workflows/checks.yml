name: Code checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install native development tools
        run: brew install neovim lua-language-server
      - run: pnpm install --frozen-lockfile
      - name: Set Neovim runtime for LuaLS
        run: echo "VIMRUNTIME=$(nvim --headless -u NONE +'lua io.stdout:write(vim.env.VIMRUNTIME)' +qa! 2>/dev/null)" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
