name: cli-cmd.nvim

# The plugin lives inside this dotfiles repo, so only its own changes (and its own
# workflow) start it: a tweak to the terminal or picker config has nothing to prove
# here.
on:
  push:
    paths:
      - 'dotfiles/configs/nvim-pack/cli-cmd.nvim/**'
      - '.github/workflows/cli-cmd.yml'
  pull_request:
    paths:
      - 'dotfiles/configs/nvim-pack/cli-cmd.nvim/**'
      - '.github/workflows/cli-cmd.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # `stable` is the release the plugin targets (0.12). The tests narrow
      # themselves where a tool is missing — `palette` is never installed on the
      # runner, and Homebrew is used when the image provides it — so the job also
      # says which tools it had, leaving no doubt about what a green run covered.
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # The ubuntu image ships Homebrew but keeps it off PATH. The brew tool is the
      # only one whose tests need a real package manager, so putting it on PATH is
      # what makes those tests run on Linux instead of skipping themselves — and
      # Linuxbrew is a different build from the macOS one, which is the point.
      - name: Put Linuxbrew on PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Which tools this run had
        run: |
          {
            echo '### Runner'
            nvim --version | head -1
            echo
            for tool in git sh brew palette; do
              printf -- '- %s: `%s`\n' "$tool" "$(command -v "$tool" || echo missing)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the suite
        working-directory: dotfiles/configs/nvim-pack/cli-cmd.nvim
        run: |
          set -o pipefail
          nvim --clean --headless -i NONE -l tests/run.lua 2>&1 | tee "$RUNNER_TEMP/suite.log"

      # Green is not evidence by itself: the run is worth reading, so the result and
      # the slowest tests are put where the workflow page shows them — the step
      # summary for a person, a notice annotation for anything that reads the check
      # (including the API, which does not need a token for a public repo).
      - name: What the suite said
        if: always()
        run: |
          total='the suite never ran'
          if [ -f "$RUNNER_TEMP/suite.log" ]; then
            total=$(grep -E '^[0-9]+ tests,' "$RUNNER_TEMP/suite.log" | tail -n 1)
            total=${total:-'no total line'}
          fi
          echo "::notice title=cli-cmd.nvim suite::${total}"
          {
            echo '### cli-cmd.nvim suite'
            echo
            echo "**${total}**"
            if [ -f "$RUNNER_TEMP/suite.log" ]; then
              echo
              echo 'Skipped or failed cases, if any:'
              echo '```'
              grep -E '^(SKIP|FAIL) ' "$RUNNER_TEMP/suite.log" || echo 'none'
              echo '```'
              echo 'Slowest tests:'
              echo '```'
              grep -E '^(PASS|FAIL) ' "$RUNNER_TEMP/suite.log" | sort -t'(' -k2 -rn | head -5 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
